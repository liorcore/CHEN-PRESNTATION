<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>פרויקטים</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --panel-width:240px;
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.08);
    }
    html,body{margin:0;padding:0;height:100%; font-family:'Rubik',sans-serif; background: linear-gradient(180deg,#05060a,#0b1220); color:#fff; overflow-x:hidden;}
    #sidePanel{
      position: fixed;
      top:50%;
      right:0;
      transform: translateY(-50%);
      width: var(--panel-width);
      max-width:34%;
      background: rgba(6,10,18,0.85);
      border-left:1px solid rgba(255,255,255,0.04);
      box-shadow:-8px 10px 40px rgba(2,6,23,0.6);
      padding:.75rem;
      display:flex;
      flex-direction: column;
      align-items:center;
      gap:.5rem;
      border-radius:12px 0 0 12px;
      backdrop-filter: blur(8px);
      z-index:120;
    }
    #sidePanel h3{color:#7dd3fc;margin:0;font-weight:800;font-size:.95rem;text-align:center;}
    .side-btn{
      width: calc(var(--panel-width)-1.4rem);
      padding:.55rem .6rem;
      border-radius:999px;
      background:transparent;
      border:1px solid rgba(125,211,252,0.18);
      color:#cde7f5;
      font-weight:700;
      text-align:center;
      cursor:pointer;
      transition:all .18s ease;
    }
    .side-btn:hover{background: rgba(125,211,252,0.12); color:#fff; transform: translateX(-4px);}
    .side-btn.active{background: linear-gradient(90deg,#22c55e,#06b6d4); color:#012; box-shadow:0 6px 22px rgba(34,197,94,0.12);}
    
    .swiper {margin-right: var(--panel-width); width:calc(100vw - var(--panel-width)); height:100vh;}
    @media(max-width:900px){#sidePanel{display:none;} .swiper{margin-right:0;width:100vw;}}
    
    .swiper-slide{
      display:flex; flex-direction:column; justify-content:center; align-items:center; padding:2rem; box-sizing:border-box;
    }
    
    .card{
      display:flex; flex-wrap:wrap; gap:1.6rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid var(--glass-border);
      border-radius:16px;
      padding:1.6rem;
      box-shadow:0 12px 40px rgba(2,6,23,0.6);
      max-width:1200px;
      width:100%;
    }
    .left-col{flex:1 1 420px; min-width:300px; font-size:1.07rem; line-height:1.5;}
    .right-col{flex:1.15 1 540px; min-width:340px; display:flex; flex-direction:column; gap:1rem;}
    
    .img-grid{width:100%; display:grid; grid-template-columns:1fr; gap:.75rem;}
    @media(min-width:900px){.img-grid{grid-template-columns:repeat(2,1fr);}}
    .img-grid img, .single-img img{width:100%; height:auto; max-height:280px; object-fit:cover; border-radius:12px; box-shadow:0 10px 30px rgba(2,6,23,0.6); transition: transform .45s, filter .3s;}
    .img-grid img:hover, .single-img img:hover{transform:scale(1.03) rotate(-0.3deg); filter:brightness(1.03);}
    
    .logo{position:fixed; top:1rem; right:calc(var(--panel-width)+1rem); height:56px; z-index:130; opacity:.98;}
    @media(max-width:900px){.logo{right:1rem;}}
    
    h1.title-main{font-size:clamp(30px,6vw,56px); margin:0; font-weight:900;}
    
    @media(max-width:720px){
      .card{flex-direction:column; align-items:flex-start;}
      .left-col,.right-col{width:100%; min-width:unset;}
      .img-grid img,.single-img img{max-height:200px;}
      .logo{height:48px; top:.8rem;}
    }
  </style>
</head>
<body>
  
<div id="sidePanel">
  <h3>ניווט מהיר</h3>
  <button class="side-btn active" data-slide="0">פרויקט 1</button>
  <button class="side-btn" data-slide="1">פרויקט 2</button>
  <button class="side-btn" data-slide="2">פרויקט 3</button>
</div>

<img class="logo" src="logo.png" alt="לוגו">

<div class="swiper">
  <div class="swiper-wrapper">
    <!-- פרויקט 1 -->
    <div class="swiper-slide">
      <div class="card">
        <div class="left-col">
          <h1 class="title-main">פרויקט ראשון</h1>
          <p>תיאור מלא של הפרויקט הראשון. ניתן להוסיף כאן כל מידע רלוונטי.</p>
        </div>
        <div class="right-col">
          <div class="img-grid">
            <img src="img1.jpg" alt="">
            <img src="img2.jpg" alt="">
          </div>
        </div>
      </div>
    </div>
    <!-- פרויקט 2 -->
    <div class="swiper-slide">
      <div class="card">
        <div class="left-col">
          <h1 class="title-main">פרויקט שני</h1>
          <p>תיאור מלא של הפרויקט השני. כאן ניתן להוסיף תמונות וקישורים.</p>
        </div>
        <div class="right-col">
          <div class="img-grid">
            <img src="img3.jpg" alt="">
            <img src="img4.jpg" alt="">
          </div>
        </div>
      </div>
    </div>
    <!-- פרויקט 3 -->
    <div class="swiper-slide">
      <div class="card">
        <div class="left-col">
          <h1 class="title-main">פרויקט שלישי</h1>
          <p>תיאור מלא של הפרויקט השלישי. ניתן להוסיף פרטים נוספים כאן.</p>
        </div>
        <div class="right-col">
          <div class="img-grid">
            <img src="img5.jpg" alt="">
            <img src="img6.jpg" alt="">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const swiper = new Swiper('.swiper', {
    direction:'vertical',
    mousewheel:true,
    slidesPerView:1,
    spaceBetween:30,
  });

  const buttons = document.querySelectorAll('.side-btn');
  buttons.forEach(btn=>{
    btn.addEventListener('click',()=>{
      const index = btn.dataset.slide;
      swiper.slideTo(index);
      buttons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  swiper.on('slideChange',()=>{
    const currentIndex = swiper.activeIndex;
    buttons.forEach(b=>{
      b.classList.remove('active');
      if(b.dataset.slide==currentIndex)b.classList.add('active');
    });
  });
</script>

</body>
</html>
