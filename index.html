<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>חפיפת פרויקטים לטובת חופשת האינג'יניר</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Tailwind CDN + Swiper CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.08);
      --panel-width: 240px;
    }
    html,body{height:100%; margin:0; font-family:'Rubik',sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
    body{
      background: linear-gradient(180deg,#05060a 0%, #0b1220 100%);
      color: #fff;
      overflow: hidden;
    }

    /* SIDEBAR (RIGHT) */
    #sidePanel{
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: var(--panel-width);
      max-width: 34%;
      background: rgba(6,10,18,0.85);
      border-left: 1px solid rgba(255,255,255,0.04);
      box-shadow: -8px 10px 40px rgba(2,6,23,0.6);
      padding: 0.75rem;
      z-index: 120;
      display:flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      border-radius: 12px 0 0 12px;
      backdrop-filter: blur(8px);
    }
    #sidePanel h3{ color:#7dd3fc; margin:0; font-weight:800; font-size:0.95rem; text-align:center; user-select:none; }
    .side-btn {
      width: calc(var(--panel-width) - 1.4rem);
      padding: 0.55rem 0.6rem;
      border-radius: 999px;
      background: transparent;
      border: 1px solid rgba(125,211,252,0.18);
      color: #cde7f5;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: all .18s ease;
      user-select: none;
    }
    .side-btn:hover { background: rgba(125,211,252,0.12); color:#fff; transform: translateX(-4px); }
    .side-btn.active { background: linear-gradient(90deg,#22c55e,#06b6d4); color: #012; box-shadow: 0 6px 22px rgba(34,197,94,0.12); transform:none; }

    /* main swiper area shifted left so panel לא יסתיר */
    .swiper { margin-right: var(--panel-width); width: calc(100vw - var(--panel-width)); height:100vh; }

    @media (max-width: 900px) {
      #sidePanel { display:none; } /* מסתיר במובייל */
      .swiper { margin-right: 0; width: 100vw; }
    }

    /* slide layout */
    .swiper-slide {
      width: 100%;
      height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 2rem;
      box-sizing: border-box;
      overflow: auto;
      flex-direction: column; /* חובה למובייל */
    }

    .card {
      width:100%;
      max-width:1200px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid var(--glass-border);
      border-radius:16px;
      padding:1.6rem;
      box-shadow: 0 12px 40px rgba(2,6,23,0.6);
      display:flex;
      gap:1.6rem;
      align-items:flex-start;
      color:#e6eef8;
      flex-wrap: wrap;
    }

    .left-col { flex: 1 1 420px; min-width: 300px; font-size: 1.07rem; line-height:1.5; }
    .right-col { flex: 1.15 1 540px; min-width: 340px; display:flex; flex-direction:column; gap:1rem; align-items:center; }

    .img-grid { width:100%; display:grid; grid-template-columns:1fr; gap:0.75rem; }
    @media(min-width:900px){ .img-grid{ grid-template-columns:repeat(2,1fr);} }

    .img-grid img, .single-img img {
      width:100%;
      height:280px;
      object-fit:cover;
      border-radius:12px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      transition: transform .45s cubic-bezier(.2,.8,.2,1), filter .3s;
      transform-origin:center;
    }
    .img-grid img:hover, .single-img img:hover { transform: scale(1.03) rotate(-0.3deg); filter:brightness(1.03); }

    .logo { position: fixed; top: 1rem; right: calc(var(--panel-width) + 1rem); height:56px; z-index:130; opacity:0.98; }
    @media(max-width:900px){ .logo { right: 1rem; } }

    h1.title-main { font-size: clamp(30px, 6vw, 56px); margin:0; font-weight:900; }
    h2.project-title { font-size: clamp(22px, 3.6vw, 38px); margin:0; font-weight:800; }

    .nav-btn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 1.4rem;
      z-index: 125;
      display:flex;
      gap: .6rem;
      background: var(--glass-bg);
      border:1px solid var(--glass-border);
      padding:.6rem .9rem;
      border-radius:9999px;
      backdrop-filter: blur(8px);
      align-items:center;
      color:#fff;
    }
    .nav-btn button{ background:transparent; border:none; color:inherit; padding:.35rem .6rem; cursor:pointer; font-weight:700; }
    .nav-btn button:hover{ color:#7dd3fc; transform:translateY(-2px); }

    .progress {
      position: fixed;
      bottom:1.6rem;
      right: calc(var(--panel-width) + 1.6rem);
      z-index:125;
      font-size:1rem;
      color:#cbd5e1;
      background: rgba(2,6,23,0.45);
      padding: .45rem .7rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.03);
    }
    @media(max-width:900px){ .progress { right:1.6rem; } }

    .reveal { opacity:0; transform: translateY(10px); transition: all .6s cubic-bezier(.2,.9,.25,1); }
    .reveal.visible { opacity:1; transform: translateY(0); }

    /* footer under content */
    .footer-note { margin-top:1rem; text-align:center; color:#9fb0c7; font-size:0.95rem; font-style:italic; user-select:none; }

    .final-warning {
      background: linear-gradient(90deg,#fef3c7,#facc15);
      color:#7a2b00;
      border-radius:12px;
      padding: 1.25rem 1.5rem;
      font-weight:900;
      font-size: clamp(22px, 4.5vw, 42px);
      text-align:center;
      box-shadow: 0 14px 40px rgba(0,0,0,0.25);
      display:inline-block;
      animation: warn-blink 1.2s steps(2, end) infinite, warn-bounce 0.9s ease-in-out infinite;
    }
    .final-sub {
      margin-top:0.8rem;
      color:#7a2b00;
      font-weight:800;
      font-size: clamp(16px, 2.8vw, 22px);
      animation: warn-blink 1.2s steps(2, end) infinite;
    }
    @keyframes warn-blink { 0%{opacity:1;}50%{opacity:0.15;}100%{opacity:1;} }
    @keyframes warn-bounce { 0%{transform:translateY(0);}50%{transform:translateY(-10px);}100%{transform:translateY(0);} }

    @media(max-width:720px){
      .card{ padding:1rem; flex-direction:column; align-items:center; text-align:center; }
      .left-col, .right-col{ width:100%; min-width:unset; }
      .img-grid img, .single-img img{ height:200px; }
    }
  </style>
</head>
<body>

  <img src="PLE-LOGO.png" alt="PLE" class="logo" />

  <!-- SIDE PANEL (מוסתר במובייל) -->
  <nav id="sidePanel" aria-label="ניווט שקופיות">
    <h3>תפריט שקופיות</h3>
  </nav>

  <div class="nav-btn" role="navigation" aria-label="ניווט שקופיות">
    <button id="prevBtn" aria-label="שקופית קודמת">הקודם ⟶</button>
    <button id="nextBtn" aria-label="שקופית הבאה">⟵ הבא </button>
  </div>

  <div class="progress" id="progress">1 / 8</div>

  <div class="swiper mySwiper" id="app">
    <div class="swiper-wrapper">

      <!-- דוגמה לשקופית -->
      <section class="swiper-slide slide" data-index="1" aria-label="שקופית 1">
        <div class="card reveal">
          <div class="left-col">
            <h1 class="title-main">חפיפת פרויקטים</h1>
            <p class="text-cyan-300 mt-3 font-semibold">לטובת חופשת האינג'יניר</p>
            <p class="mt-4 text-slate-200 leading-relaxed">מצגת זו מציגה סקירה מקיפה של הפרויקטים הלאומיים והתשתיתיים שבניהולנו — פרטי פרויקט, תקציבים, לוחות זמנים, תמונות ומידע צוותי.</p>
          </div>
          <div class="right-col single-img">
            <img src="מחצבת ורד.png" alt="תצוגה כללית" class="rounded-lg shadow-xl" />
          </div>
        </div>
        <div class="footer-note">ניתן לפנות בכל עת לאינג' מיטב חכים</div>
      </section>

      <!-- ניתן להוסיף כאן את כל שאר השקופיות כמו קודם, עם footer-note מתחת -->

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.mySwiper', {
      direction: 'vertical',
      mousewheel: true,
      keyboard: { enabled: true },
      speed: 700,
      effect: 'slide',
      slidesPerView: 1,
      a11y: true,
    });

    document.getElementById('prevBtn').addEventListener('click', ()=> swiper.slidePrev());
    document.getElementById('nextBtn').addEventListener('click', ()=> swiper.slideNext());

    const progressEl = document.getElementById('progress');
    function updateProgress(){
      const idx = swiper.realIndex + 1;
      const total = swiper.slides.length;
      progressEl.textContent = `${idx} / ${total}`;
    }
    swiper.on('slideChange', updateProgress);
    updateProgress();

    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

    document.querySelectorAll('img').forEach(img=>{
      img.loading = 'lazy';
      if(!img.alt || img.alt.trim()==='') img.alt = 'תמונה פרויקט';
    });

    const sidePanel = document.getElementById('sidePanel');
    const slideButtons = [];
    function getSlideTitle(slideEl, idx){
      const h1 = slideEl.querySelector('h1.title-main');
      if(h1) return h1.textContent.trim();
      const h2 = slideEl.querySelector('h2.project-title');
      if(h2) return h2.textContent.trim();
      const anyHeading = slideEl.querySelector('h1, h2, h3');
      if(anyHeading) return anyHeading.textContent.trim();
      return `שקופית ${idx+1}`;
    }
    swiper.slides.forEach((slide, idx) => {
      const title = getSlideTitle(slide, idx);
      const btn = document.createElement('button');
      btn.className = 'side-btn';
      btn.innerText = title;
      btn.setAttribute('aria-label', `מעבר ל${title}`);
      btn.addEventListener('click', ()=> swiper.slideTo(idx));
      sidePanel.appendChild(btn);
      slideButtons.push(btn);
    });

    function updateActiveSide(){
      slideButtons.forEach((b, i) => b.classList.toggle('active', i === swiper.activeIndex));
    }
    swiper.on('slideChange', updateActiveSide);
    updateActiveSide();

    document.querySelectorAll('.swiper-slide').forEach(sl=>{
      if(!sl.querySelector('.footer-note')){
        const f = document.createElement('div');
        f.className = 'footer-note';
        f.textContent = "ניתן לפנות בכל עת לאינג' מיטב חכים";
        sl.appendChild(f);
      }
    });

    window.addEventListener('load', ()=>{
      const cur = swiper.slides[swiper.activeIndex];
      cur.querySelectorAll('.reveal').forEach(el=>el.classList
